services:
  webapp:
    image: ${WEBAPP_IMAGE}
    ports:
      - "80:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"